# The project has a zero-warning build and a set of invariants that only hold because
# something checks them — and none of it ran unless a human remembered to run it. This is that
# something.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes an in-flight run's answer irrelevant, so it is replaced
# rather than left to burn a Windows runner. A push to main is never cancelled by another: every
# commit on main keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    # Windows because the GUI tests render through Avalonia's headless backend with Skia, and the
    # desktop head is a WinExe. The engine and CLI are platform-agnostic and are covered again on
    # Linux below, which is what would catch a path or line-ending assumption creeping into Core.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned by global.json; this reads it rather than naming a version twice.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The packages are the slow half of a restore (Avalonia and Skia are large). Keyed on everything
      # that can change what is resolved, so a dependency bump misses the cache instead of reusing a
      # stale one.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # nuget.config clears inherited sources and pins nuget.org, so a restore here resolves from
      # exactly what the repository declares. (No --locked-mode: lock files that drift out of step
      # with Directory.Packages.props fail CI in a way that reads as a broken pipeline rather than a
      # dependency change, which costs more than it catches at this size.)
      - name: Restore
        run: dotnet restore nfty.sln

      # TreatWarningsAsErrors is on in Directory.Build.props, so "0 warnings" is enforced by the
      # build itself rather than by reading the log. The solution includes samples/, so the code the
      # manual's embedding guide quotes is compiled here on every change.
      - name: Build
        run: dotnet build nfty.sln --no-restore -c Release

      - name: Test
        run: dotnet test nfty.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/tests

      # Runs outside xUnit: a nested Headless session would invalidate its runner's application.
      - name: Late headless callbacks retain their owner's dispatcher
        run: |
          dotnet run --project tools/verification/headless-callback-probe -c Release
          dotnet run --project tools/verification/headless-callback-probe -c Release --no-build -- --dispose

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the capture tools' image library
        run: python -m pip install -r tools/demo/requirements.txt

      # Native calls are replaced before the scripts execute; these tests cannot click the desktop.
      - name: Release and authoring tool regressions (including PowerShell guards)
        run: python -m unittest discover -s tools/tests -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests

  # A separate job so an advisory published overnight reports a security problem without failing an
  # unrelated code change — the reason NU1901-NU1904 are excluded from TreatWarningsAsErrors.
  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore nfty.sln
      - name: Audit the whole dependency graph
        run: dotnet list nfty.sln package --vulnerable --include-transitive

  # The engine and the CLI carry the determinism guarantees, and those are exactly what a
  # platform-specific assumption breaks. The GUI tests run on Linux in `app-linux` below (headless).
  #
  # THREE operating systems, not one. Determinism is promised across machines and architectures, and
  # `SealTests` additionally depends on `AesGcm` being present at all — a platform capability, not a
  # language feature, which `Seal.IsSupported` exists to answer. A guard nothing ever runs on a
  # second platform is a guard nobody has checked; macOS runs on arm64 here, which is also the only
  # place the little-endian seed-hash rule gets exercised on different silicon.
  core-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Nfty.Core.Tests -c Release
      - run: dotnet test tests/Nfty.Cli.Tests -c Release
      # A model's bytes are promised identical for identical input on any machine, exactly as a
      # cooked Set's are, so the engine that writes them is checked on all three systems too.
      - run: dotnet test tests/Nfty.Model.Tests -c Release

  # The GUI tests on Linux. They render through Avalonia's HEADLESS backend (Skia, no X server), so
  # no display stack is needed - what this catches is a Linux-only difference in the app layer: a
  # path separator, a case-sensitive resource name, a Windows-only API reached without a guard, the
  # Linux secret store's argv/stdin contract (SecretToolStoreTests runs only here and on macOS). The
  # whole suite passed on WSL Ubuntu 24.04 before this job existed; this keeps it that way. Skia's
  # Linux native needs fontconfig, which ubuntu-latest carries.
  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet test tests/Nfty.App.Tests -c Release
      - run: dotnet test tests/Nfty.Ticket.Tests -c Release
      - run: dotnet test tests/Nfty.Ticket.NetStandard.Tests -c Release
      - name: Late headless callbacks retain their owner's dispatcher
        run: |
          dotnet run --project tools/verification/headless-callback-probe -c Release
          dotnet run --project tools/verification/headless-callback-probe -c Release --no-build -- --dispose

  # What is GENERATED and committed has to be what the source would generate now, and the manual has
  # to build. None of this needs a display, so it runs on Linux, once.
  #
  #   - tools/api-docs/build.py --check   the API reference pages vs the XML docs and public surface
  #   - tools/api-docs/build.py --lint    the XML docs themselves: blank, name-only or incomplete entries
  #   - tools/demo/build-demo.py --check  the embedded demo CookBook vs the script that draws it
  #   - mkdocs build --strict             a broken link or a snippet that includes nothing fails here
  #
  # tools/icons has no --check: IconSourceTests already fails the build when Icons.axaml and the SVGs
  # disagree, so it is covered by the test job rather than restated.
  generated-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            tools/demo/requirements.txt

      - name: Install the pinned Python toolchain
        run: python -m pip install -r docs/requirements.txt -r tools/demo/requirements.txt

      # The demo script drives the CLI's own authoring commands through `dotnet run --no-build`, which
      # wants the Debug build.
      - name: Build the CLI
        run: dotnet build src/Nfty.Cli

      - name: The embedded demo CookBook matches its generator
        run: python tools/demo/build-demo.py --check

      # Builds the libraries in Release (their XML docs are an input) and a small tool that prints
      # their public surface, so this step is also what notices a doc comment edited without
      # regenerating the pages.
      - name: The API reference matches the code
        run: python tools/api-docs/build.py --check

      # The compiler enforces that a comment EXISTS and that its param/typeparam/cref tags agree with
      # the code; it cannot see a blank summary, one that only repeats the member's name, a method
      # that returns a value without saying what, or an undescribed type parameter. The pages are the
      # published reference, so that bar is checked here, against the same XML they are made from.
      - name: Every public member is documented, not just commented
        run: python tools/api-docs/build.py --lint

      # Reuses the surface tool built by --check. Other tooling proofs use temp directories and a
      # loopback HTTP server; no release packaging, browser, native app or generated-asset writes.
      - name: Release and authoring tool regressions (including the real API surface)
        env:
          NFTY_TEST_API_SURFACE: '1'
        run: python -m unittest discover -s tools/tests -v

      # The ONE manual build. It never publishes: the manual is served at www.vaporsoft.dev/nfty/docs/
      # by the Vaporsoft site, which clones this repository and runs this same pinned toolchain on
      # every deploy (GitHub Pages is deliberately disabled here: a repository Pages site reserves
      # /<repo>/** on the parent user site). Failing here catches a broken link or missing figure on
      # the commit that caused it, not in the site's deploy later. --strict turns either into a
      # failure. The checkout must include src/Nfty.App/Assets/Fonts: tools/mkdocs-hooks/fonts.py zips
      # the app's fonts into the site as the typeface download.
      - name: Build the manual
        run: python -m mkdocs build --strict

      # Written by the hook at post-build; missing, the page renders and its download link 404s.
      - name: Check the typeface bundle was built
        run: test -s .mkdocs-site/assets/fonts/ibm-plex-nfty.zip

      # Kept for inspection, not for publishing - the site builds its own copy.
      - name: Upload the built manual
        uses: actions/upload-artifact@v4
        with:
          name: nfty-manual
          path: .mkdocs-site
          retention-days: 7

  # The two embedding samples are the documentation's proof, so they are RUN, not just compiled: a
  # sample that builds and then throws on a real Menu teaches the wrong thing. Linux and Windows,
  # because the claim is that the libraries behave the same on both.
  samples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Make a Menu from the demo CookBook
        shell: bash
        run: |
          dotnet run --project src/Nfty.Cli -c Release -- demo "$RUNNER_TEMP/demo"
          dotnet run --project src/Nfty.Cli -c Release -- menu "$RUNNER_TEMP/demo/ChestDemo.cbk" --out "$RUNNER_TEMP/demo/chest.mnu"

      - name: Run the Nfty.Ticket sample (references nothing but Nfty.Ticket)
        shell: bash
        run: dotnet run --project samples/Nfty.Ticket.Sample -c Release -- "$RUNNER_TEMP/demo/chest.mnu" ci-seed

      - name: Run the full-engine sample
        shell: bash
        run: |
          dotnet run --project samples/Nfty.Embedding.Sample -c Release --             "$RUNNER_TEMP/demo/ChestDemo.cbk" "$RUNNER_TEMP/demo/chest.mnu" "$RUNNER_TEMP/demo/out"
          test -s "$RUNNER_TEMP/demo/out/0001.glb"
          test -s "$RUNNER_TEMP/demo/out/ticket.png"
