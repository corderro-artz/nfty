# nfty user manual — Material for MkDocs.
#
# docs_dir is docs/manual rather than docs/, on purpose: docs/ also holds the locked design mockups
# and the superpowers specs, and MkDocs copies everything under docs_dir into the built site. The
# manual is the only thing here meant for a user to read.
#
#   python -m pip install -r docs/requirements.txt
#   python -m mkdocs serve     # live preview on http://127.0.0.1:8000
#   python -m mkdocs build     # static site into .mkdocs-site/ (gitignored)

site_name: nfty
# Needed for canonical links and the sitemap, and it is the published address rather than a guess:
# a project site on GitHub Pages lives under the owner's github.io at the repository's name.
site_url: https://corderro-artz.github.io/nfty/
site_description: The nfty manual - how to draw a handful of layers and cook them into a collection.
site_author: Vaporsoft
repo_url: https://github.com/corderro-artz/nfty
repo_name: corderro-artz/nfty
edit_uri: edit/main/docs/manual/

docs_dir: docs/manual
site_dir: .mkdocs-site

# includes/ holds the abbreviation list appended to every page by pymdownx.snippets. It is a
# fragment, not a page: excluded from the build so it never ships as a URL of its own.
exclude_docs: |
  includes/

copyright: >
  &copy; 2026 <a href="https://www.vaporsoft.dev" rel="noopener">Vaporsoft</a>. All rights reserved.

theme:
  name: material
  language: en
  # No Google Fonts request. The manual serves IBM Plex itself, from stylesheets/vaporsoft.css, so
  # this site asks no third party for a typeface - which also means it renders the same on a machine
  # that has never heard of Plex. Weighed and accepted: 472K of woff2 against a 7M site, most of
  # which is screenshots. Self-hosting also gets the exact four weights the app ships; Material's
  # own font: shorthand requests 300/400/700 and would leave the manual without Medium or SemiBold.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Match my system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

# The installable bundle the Reference index offers is BUILT from the app's own font files rather
# than committed a second time, so the site can never hand out a face the product has stopped using.
# The hook lives outside docs_dir; anything inside it would be copied into the site as a page.
hooks:
  - tools/mkdocs-hooks/fonts.py

extra_css:
  - stylesheets/vaporsoft.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.vaporsoft.dev
      name: Vaporsoft
    - icon: fontawesome/brands/github
      link: https://github.com/corderro-artz/nfty
      name: nfty on GitHub
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      # Material ships its own icon set; without this the :material-...: shortcodes render as
      # literal text on the page.
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      # base_path defaults to the PROJECT ROOT, not docs_dir, so the include has to be named from
      # there or it silently resolves to nothing and every abbreviation quietly disappears.
      base_path:
        - docs/manual
      check_paths: true
      auto_append:
        - includes/glossary.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - glightbox

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - get-started/install.md
      - get-started/first-collection.md
      - get-started/first-layer.md
  - How do I…:
      - how-to/index.md
      - how-to/rarer-trait.md
      - how-to/exclude-combinations.md
      - how-to/reorder-layers.md
      - how-to/line-layers-up.md
      - how-to/import-art.md
      - how-to/paint-in-color.md
      - how-to/soft-edges.md
      - how-to/inspect-an-asset.md
      - how-to/more-assets.md
      - how-to/kitchen.md
      - how-to/raise-unique-count.md
  - How nfty works:
      - understand/index.md
      - understand/six-words.md
      - understand/why-gray.md
      - understand/layer-kinds.md
      - understand/uniqueness.md
      - understand/seeds.md
      - understand/no-resizing.md
  - Reference:
      - reference/index.md
      - reference/opening-screen.md
      - reference/explorer.md
      - reference/editor.md
      - reference/shortcuts.md
      - reference/cli.md
      - reference/file-formats.md
      - reference/set-contents.md
      - reference/errors.md
      - reference/glossary.md
