# nfty user manual — Material for MkDocs.
#
# docs_dir is docs/manual rather than docs/, on purpose: docs/ also holds the locked design mockups
# and the superpowers specs, and MkDocs copies everything under docs_dir into the built site. The
# manual is the only thing here meant for a user to read.
#
#   python -m pip install -r docs/requirements.txt
#   python -m mkdocs serve     # live preview on http://127.0.0.1:8000
#   python -m mkdocs build     # static site into .mkdocs-site/ (gitignored)

site_name: nfty
# Needed for canonical links and the sitemap, and it is the CUSTOM DOMAIN rather than the github.io
# address. The account has one configured, so corderro-artz.github.io/nfty 301s here - and declaring
# that as canonical would have pointed every search engine at a URL that redirects away from the
# page it is supposed to identify. Taken from `gh api repos/.../pages`, not guessed.
site_url: https://www.vaporsoft.dev/nfty/docs/
site_description: The nfty manual - how to draw a handful of layers and cook them into a collection.
site_author: Vaporsoft
repo_url: https://github.com/corderro-artz/nfty
repo_name: corderro-artz/nfty
edit_uri: edit/main/docs/manual/

docs_dir: docs/manual
site_dir: .mkdocs-site

# includes/ holds the abbreviation list appended to every page by pymdownx.snippets. It is a
# fragment, not a page: excluded from the build so it never ships as a URL of its own.
exclude_docs: |
  includes/

# The ~240 generated API type pages are reached from their assembly index, not from the nav: a sidebar
# of every type would bury the manual. Without this MkDocs logs one INFO line per page.
not_in_nav: |
  /reference/api/nfty-*/Nfty.*.md

copyright: >
  &copy; 2026 <a href="https://www.vaporsoft.dev" rel="noopener">Vaporsoft</a>. All rights reserved.

theme:
  name: material
  language: en
  # No Google Fonts request. The manual serves IBM Plex itself, from stylesheets/vaporsoft.css, so
  # this site asks no third party for a typeface - which also means it renders the same on a machine
  # that has never heard of Plex. Weighed and accepted: 472K of woff2 against a 7M site, most of
  # which is screenshots. Self-hosting also gets the exact four weights the app ships; Material's
  # own font: shorthand requests 300/400/700 and would leave the manual without Medium or SemiBold.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Match my system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

# The installable bundle the Reference index offers is BUILT from the app's own font files rather
# than committed a second time, so the site can never hand out a face the product has stopped using.
# The hook lives outside docs_dir; anything inside it would be copied into the site as a page.
hooks:
  - tools/mkdocs-hooks/fonts.py

extra_css:
  - stylesheets/vaporsoft.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.vaporsoft.dev
      name: Vaporsoft
    - icon: fontawesome/brands/github
      link: https://github.com/corderro-artz/nfty
      name: nfty on GitHub
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      # Material ships its own icon set; without this the :material-...: shortcodes render as
      # literal text on the page.
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      # base_path defaults to the PROJECT ROOT, not docs_dir, so the include has to be named from
      # there or it silently resolves to nothing and every abbreviation quietly disappears.
      base_path:
        - docs/manual
        # The project root, so the embedding guide can include regions of the compiled samples under
        # samples/ (`--8<-- "samples/.../Program.cs:region"`): the code a reader copies is the code CI
        # built, and the two cannot drift.
        - .
      check_paths: true
      auto_append:
        - includes/glossary.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - glightbox

# A link to a heading that does not exist fails the strict build, as a link to a missing page does.
validation:
  links:
    anchors: warn

